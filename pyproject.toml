[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "Leontief_NeuralNetwork"
version = "1.0.0"
description = "A Leontief input/output model with a regional trade matrix optimised by machine learning"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
]

[tool.setuptools.packages.find]
where = ["src"]