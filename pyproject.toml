toml

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "my-project"
version = "1.0.0"
description = "A Leontief input/output model with a regional trade matrix optimised by machine learning"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15"
]